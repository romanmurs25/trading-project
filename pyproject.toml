[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-trading-platform"
version = "0.1.0"
description = "Safety-first modular monolith for intraday trading research and paper trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "SQLAlchemy>=2.0.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
trading = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["apps*", "trading_core*", "adapters*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
mypy_path = ["packages", "."]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*", "fastapi.*", "typer.*"]
ignore_missing_imports = true
